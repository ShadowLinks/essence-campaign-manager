name: Build and publish Docker image

# Builds the Dockerfile in this repo and pushes it to Docker Hub as
# shadowlinks/essence-campaign-manager. Requires two repo secrets, set once
# under Settings -> Secrets and variables -> Actions:
#   DOCKERHUB_USERNAME - your Docker Hub username (shadowlinks)
#   DOCKERHUB_TOKEN     - a Docker Hub access token (not your password) -
#                         create one at hub.docker.com -> Account Settings ->
#                         Security -> New Access Token, "Read & Write" scope.

"on":
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            shadowlinks/essence-campaign-manager:latest
            shadowlinks/essence-campaign-manager:${{ github.sha }}