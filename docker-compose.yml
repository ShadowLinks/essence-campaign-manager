services:
  essence-campaign-manager:
    # Pulls the pre-built image from Docker Hub instead of building locally -
    # GitHub Actions rebuilds and pushes it automatically on every push to
    # this repo (see .github/workflows/docker-publish.yml). Unraid just pulls.
    image: shadowlinks/essence-campaign-manager:latest
    container_name: essence-campaign-manager
    ports:
      # Unraid's own web UI listens on 80/443, so this maps to host port 8080 by default.
      # Change the left-hand side (host port) if 8080 is already taken on your box.
      - "8080:80"
    restart: unless-stopped
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
