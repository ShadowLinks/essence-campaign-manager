services:
  essence-campaign-manager:
    # Pulls the pre-built image from Docker Hub instead of building locally -
    # GitHub Actions rebuilds and pushes it automatically on every push to
    # this repo (see .github/workflows/docker-publish.yml). Unraid just pulls.
    image: shadowlinks/essence-campaign-manager:latest
    container_name: essence-campaign-manager
    ports:
      # Unraid's own web UI listens on 80/443, so this maps to host port 8080 by default.
      # Change the left-hand side (host port) if 8080 is already taken on your box.
      - "8080:80"
    volumes:
      # Persistent campaign data - the app auto-saves to /data/state.json inside the
      # container, which lives at the host path below so it survives container restarts,
      # recreates, and image updates. On a brand-new install (empty folder) it seeds itself
      # from the bundled campaign-manager-data.json sample data baked into the image.
      #
      # This uses an absolute /mnt/user/appdata/... path (Unraid's standard place for
      # persistent app data on the array/cache pool) rather than a relative "./data" path.
      # On Unraid, the Compose Manager plugin stores its project files on the boot flash
      # drive itself (/boot/config/plugins/compose.manager/projects/...) - a relative path
      # would put continuously-autosaved data there, which is small, slow flash storage not
      # meant for that. If you're running this with plain docker-compose somewhere else
      # (not Unraid's plugin), a relative "./data:/data" works fine too - swap it back in.
      - /mnt/user/appdata/essence-campaign-manager/data:/data
      # Persistent, mapped directory for Unraid's built-in per-container Tailscale
      # hook to store its ".tailscale_state" in - this is what was missing when it
      # errored with "Couldn't detect persistent Docker directory for .tailscale_state".
      # Same boot-flash reasoning as above - kept on appdata instead of a relative path.
      # After adding this and recreating the container: Unraid Docker tab -> click this
      # container's icon -> Edit -> enable Tailscale -> toggle "Advanced View" (top
      # right of that panel) -> set "Tailscale State Directory" to
      # /config/.tailscale_state -> Apply.
      - /mnt/user/appdata/essence-campaign-manager/tailscale-state:/config
    restart: unless-stopped
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
